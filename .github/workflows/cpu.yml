name: CPU validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -c constraints/cpu.txt -e '.[mujoco,export,dev]'
      - run: python -m pip install torch==2.5.1+cpu torchvision==0.20.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch only AMP algorithm dependency at locked commit
        run: |
          git clone https://github.com/Renforce-Dynamics/beyondAMP.git .cache/upstream/beyondAMP
          git -C .cache/upstream/beyondAMP checkout --detach cee88cdc0958c417e316f9452f802e25a71bc289
          python -m pip install --no-deps -e .cache/upstream/beyondAMP/source/beyondAMP -e .cache/upstream/beyondAMP/source/rsl_rl_amp
      - run: make PYTHON=python check test
